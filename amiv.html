<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM-IV — StudyHub</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-logo">StudyHub</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#subjects">Subjects</a>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>📐 AM-IV</h1>
    <p>Watch the videos below and drop your feedback!</p>
  </div>

  <!-- VIDEOS SECTION -->
  <section class="videos-section">
    <div class="videos-grid" id="videos-grid">
      <div class="loading" id="loading-msg">Loading videos...</div>
    </div>
  </section>

  <!-- DOUBTS SECTION -->
  <section class="doubts-section" id="doubts">

    <h2>🙋 Ask a Doubt</h2>
    <p>Have a question? Fill in the form below and we'll help you out.</p>

    <div class="doubt-form">
      <input type="text" id="doubt-name" placeholder="Your Name" />
      <input type="email" id="doubt-email" placeholder="Your Email" />
      <textarea id="doubt-message" placeholder="Type your doubt here..."></textarea>
      <button class="btn-primary" onclick="submitDoubt()">Submit Doubt</button>
      <p class="doubt-msg" id="doubt-msg"></p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>Made with ❤️ for studying · StudyHub 2026</p>
  </footer>

  <script src="script.js"></script>

<!-- This MUST be before script.js -->
  <script>
    const CURRENT_SUBJECT = 'amiv'
  </script>

  <script src="script.js"></script>
  
</body>
</html>
